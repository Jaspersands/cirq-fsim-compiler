[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirq-fsim-compiler"
version = "0.3.0"
description = "Differentiable and Riemannian synthesis of two-qubit unitaries into calibrated FSim gates, a Cirq transformer with 3-qubit support, and OpenQASM 3 I/O"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jasper Sands" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "jax>=0.4.0",
    "cirq-core>=1.3.0",
    "networkx>=2.8",
]

[project.scripts]
cirq-fsim = "cirq_fsim_compiler.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
