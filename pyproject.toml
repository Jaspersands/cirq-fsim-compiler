[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirq-fsim-compiler"
version = "0.5.0"
description = "Numerical synthesis of two-qubit unitaries into free or calibrated FSim gates (Sycamore, sqrt-iSWAP, CZ), Weyl-chamber gate counts, noise-aware approximation, a Cirq transformer, OpenQASM 3 I/O, and a comparison with Cirq"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Jasper Sands" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "jax>=0.4.0",
    "cirq-core>=1.3.0",
    "networkx>=2.8",
]

[project.scripts]
cirq-fsim = "cirq_fsim_compiler.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
figures = [
    "matplotlib>=3.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that take more than about 1.5 s (deselect with -m 'not slow')",
]
# an exact synthesis that misses its target is an error in the test suite
filterwarnings = [
    "error::cirq_fsim_compiler.riemannian_optimizer.SynthesisWarning",
]
